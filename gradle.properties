# Until all the dependencies move to android X
android.useAndroidX = true
android.enableJetifier = true

ANDROID_X_VERSION=1+

GRADLE_CLASS_PATH=com.android.tools.build:gradle:4.1.2

PROTOBUF_CLASS_PATH=com.google.protobuf:protobuf-gradle-plugin:0.8.8
PROTOBUF_DEPENDENCY=com.google.protobuf.nano:protobuf-javanano:3.0.0-alpha-7

# Force x86_64 arch so protoc 3.0.0 (no aarch64 binary) can be downloaded and run via Rosetta 2
osdetector.osarch=x86_64

BUILD_TOOLS_VERSION=28.0.3
COMPILE_SDK=android-30
